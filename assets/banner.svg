<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="David, Full-Stack Developer">
<defs>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36D27E"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#36D27E" stroke-opacity=".08"/></pattern>
  <radialGradient id="fade"><stop offset=".25" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#36D27E" stop-opacity="0"/><stop offset=".5" stop-color="#36D27E" stop-opacity=".12"/><stop offset="1" stop-color="#36D27E" stop-opacity="0"/></linearGradient>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .line{opacity:0;animation:show 9s infinite}
    @keyframes show{0%{opacity:0;transform:translateX(-8px)}6%{opacity:1;transform:translateX(0)}88%{opacity:1}100%{opacity:0}}
    .l1{animation-delay:.4s}.l2{animation-delay:1s}.l3{animation-delay:1.6s}.l4{animation-delay:2.2s}.l5{animation-delay:2.8s}.l6{animation-delay:3.4s}
  </style>
</defs>
<rect width="1200" height="340" fill="#07130D"/>
<rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>
<g filter="url(#glow)">
  <circle cx="1000" cy="80" r="140" fill="#36D27E" fill-opacity=".26"><animate attributeName="cx" values="1000;1060;1000" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="320" r="150" fill="#FFFFFF" fill-opacity=".12"><animate attributeName="cx" values="160;260;160" dur="11s" repeatCount="indefinite"/></circle>
</g>
<rect x="0" y="-120" width="1200" height="120" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="0 0;0 480" dur="6s" repeatCount="indefinite"/></rect>
<g class="mono" font-size="26" fill="#36D27E" fill-opacity=".24">
  <text x="640" y="70">{ }</text><text x="700" y="300">&lt;/&gt;</text><text x="1160" y="60">[ ]</text>
  <text x="735" y="40">&amp;&amp;</text><text x="1160" y="305">;</text><text x="70" y="40">#</text>
</g>
<g class="mono" font-weight="800">
  <text x="70" y="172" font-size="104" fill="url(#green)" filter="url(#softGlow)" opacity=".55">&lt;David /&gt;</text>
  <text x="70" y="172" font-size="104"><tspan fill="#36D27E">&lt;</tspan><tspan fill="url(#green)">David</tspan><tspan fill="#FFFFFF"> /&gt;</tspan></text>
</g>
<text x="74" y="228" class="mono" font-size="28" font-weight="600" fill="#F3F7F4">Full-Stack Developer</text>
<text x="74" y="268" class="mono" font-size="19" fill="#A9B8AD">backend logic / scalable apps / clean UI to database<tspan class="cursor" fill="#36D27E"> _</tspan></text>
<g transform="translate(790 62)">
  <rect width="360" height="216" rx="14" fill="#0D1F16" stroke="#20402D"/>
  <circle cx="22" cy="22" r="6" fill="#36D27E"/><circle cx="42" cy="22" r="6" fill="#FFFFFF"/><circle cx="62" cy="22" r="6" fill="#7CBF91"/>
  <text x="338" y="26" class="mono" font-size="12" fill="#A9B8AD" text-anchor="end">ship.py</text>
  <g class="mono" font-size="17">
    <g class="line l1"><text x="22" y="64" fill="#66796D">1</text><text x="50" y="64"><tspan fill="#36D27E">def ship</tspan><tspan fill="#F3F7F4">(idea):</tspan></text></g>
    <g class="line l2"><text x="22" y="90" fill="#66796D">2</text><text x="50" y="90" fill="#F3F7F4">    design(idea)</text></g>
    <g class="line l3"><text x="22" y="116" fill="#66796D">3</text><text x="50" y="116" fill="#F3F7F4">    build(idea)</text></g>
    <g class="line l4"><text x="22" y="142" fill="#66796D">4</text><text x="50" y="142" fill="#F3F7F4">    test(idea)</text></g>
    <g class="line l5"><text x="22" y="168" fill="#66796D">5</text><text x="50" y="168"><tspan fill="#36D27E">    return</tspan><tspan fill="#FFFFFF"> "shipped"</tspan></text></g>
    <g class="line l6"><text x="22" y="198" fill="#66796D">6</text><text x="50" y="198"><tspan fill="#36D27E">while True</tspan><tspan fill="#F3F7F4">: learn()</tspan></text></g>
  </g>
</g>
<rect y="336" width="1200" height="4" fill="url(#green)"/>
</svg>
