<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="David - Full-Stack Developer">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F5D4"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00F5D4" stroke-opacity="0.07"/></pattern>
  <radialGradient id="gridfade" cx="50%" cy="50%" r="70%"><stop offset="0.3" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="gm"><rect width="1200" height="340" fill="url(#gridfade)"/></mask>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00F5D4" stop-opacity="0"/><stop offset="0.5" stop-color="#00F5D4" stop-opacity="0.10"/><stop offset="1" stop-color="#00F5D4" stop-opacity="0"/></linearGradient>
  <filter id="b60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="b10" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .ln{opacity:0;animation:appear 9s infinite}
    @keyframes appear{0%{opacity:0;transform:translateX(-8px)}6%{opacity:1;transform:translateX(0)}88%{opacity:1}100%{opacity:0}}
    .l1{animation-delay:.4s}.l2{animation-delay:1s}.l3{animation-delay:1.6s}.l4{animation-delay:2.2s}.l5{animation-delay:2.8s}.l6{animation-delay:3.4s}
  </style>
</defs>

<rect width="1200" height="340" fill="#0D1117"/>
<rect width="1200" height="340" fill="url(#grid)" mask="url(#gm)"/>

<g filter="url(#b60)">
  <circle cx="1000" cy="80" r="140" fill="#00F5D4" fill-opacity="0.22"><animate attributeName="cx" values="1000;1060;1000" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="320" r="150" fill="#FF4D8D" fill-opacity="0.20"><animate attributeName="cx" values="160;260;160" dur="11s" repeatCount="indefinite"/></circle>
</g>

<rect x="0" y="-120" width="1200" height="120" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="0 0; 0 480" dur="6s" repeatCount="indefinite"/></rect>

<text x="640" y="70" font-size="30" fill="#00F5D4" fill-opacity="0.35" class="m">{ }<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="5.5s" repeatCount="indefinite"/></text><text x="700" y="300" font-size="26" fill="#FF4D8D" fill-opacity="0.3" class="m">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="7s" repeatCount="indefinite"/></text><text x="1170" y="60" font-size="34" fill="#00F5D4" fill-opacity="0.3" class="m">λ<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="6.2s" repeatCount="indefinite"/></text><text x="735" y="40" font-size="20" fill="#FF4D8D" fill-opacity="0.22" class="m">&amp;&amp;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="4.8s" repeatCount="indefinite"/></text><text x="1160" y="305" font-size="30" fill="#00F5D4" fill-opacity="0.28" class="m">;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="5.2s" repeatCount="indefinite"/></text><text x="70" y="40" font-size="24" fill="#FF4D8D" fill-opacity="0.22" class="m">[ ]<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="6.8s" repeatCount="indefinite"/></text><text x="600" y="310" font-size="24" fill="#00F5D4" fill-opacity="0.25" class="m">=&gt;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="5.9s" repeatCount="indefinite"/></text><text x="1120" y="190" font-size="26" fill="#FF4D8D" fill-opacity="0.18" class="m">#<animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="7.3s" repeatCount="indefinite"/></text>

<!-- title -->
<g class="m" font-weight="800">
  <text x="70" y="172" font-size="104" fill="url(#g)" filter="url(#b10)" opacity="0.55">&lt;David /&gt;</text>
  <text x="70" y="172" font-size="104"><tspan fill="#00F5D4" fill-opacity="0.55">&lt;</tspan><tspan fill="url(#g)">David</tspan><tspan fill="#FF4D8D" fill-opacity="0.65"> /&gt;</tspan></text>
</g>
<text x="74" y="228" class="m" font-size="28" font-weight="600" fill="#C9D1D9">Full-Stack Developer</text>
<text x="74" y="268" class="m" font-size="19" fill="#8B949E">backend logic / scalable apps / clean from UI to database<tspan class="cur" fill="#00F5D4"> _</tspan></text>

<!-- code window -->
<g transform="translate(790 62)">
  <rect width="360" height="216" rx="14" fill="#161B22" stroke="#30363D"/>
  <circle cx="22" cy="22" r="6" fill="#FF4D8D"/><circle cx="42" cy="22" r="6" fill="#FFC857"/><circle cx="62" cy="22" r="6" fill="#00F5D4"/>
  <text x="338" y="26" class="m" font-size="12" fill="#8B949E" text-anchor="end">ship.py</text>
  <g class="m" font-size="17" xml:space="preserve">
    <g class="ln l1"><text x="22" y="64" fill="#484F58">1</text><text x="50" y="64"><tspan fill="#FF4D8D">def</tspan><tspan fill="#00F5D4"> ship</tspan><tspan fill="#C9D1D9">(idea):</tspan></text></g>
    <g class="ln l2"><text x="22" y="90" fill="#484F58">2</text><text x="50" y="90" fill="#C9D1D9">&#160;&#160;&#160;&#160;design(idea)</text></g>
    <g class="ln l3"><text x="22" y="116" fill="#484F58">3</text><text x="50" y="116" fill="#C9D1D9">&#160;&#160;&#160;&#160;build(idea)</text></g>
    <g class="ln l4"><text x="22" y="142" fill="#484F58">4</text><text x="50" y="142" fill="#C9D1D9">&#160;&#160;&#160;&#160;test(idea)</text></g>
    <g class="ln l5"><text x="22" y="168" fill="#484F58">5</text><text x="50" y="168"><tspan fill="#FF4D8D">&#160;&#160;&#160;&#160;return</tspan><tspan fill="#FFC857"> "shipped"</tspan></text></g>
    <g class="ln l6"><text x="22" y="198" fill="#484F58">6</text><text x="50" y="198"><tspan fill="#FF4D8D">while</tspan><tspan fill="#00F5D4"> True</tspan><tspan fill="#C9D1D9">: learn()</tspan></text></g>
  </g>
</g>

<rect y="336" width="1200" height="4" fill="url(#g)"/>
</svg>