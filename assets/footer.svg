<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Thanks for stopping by. Let's build something useful together.">
<defs>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36D27E"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <style>.mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}</style>
</defs>
<rect width="1200" height="200" fill="#07130D"/>
<path d="M0 155Q150 120 300 155T600 155T900 155T1200 155V200H0Z" fill="#36D27E" fill-opacity=".12">
