<text x="600" y="78" class="mono" font-size="24" font-weight="700" fill="#F3F7F4" text-anchor="middle">Thanks for stopping by.</text>
<text x="600" y="108" class="mono" font-size="17" fill="#36D27E" text-anchor="middle">let's build something useful together</text>
