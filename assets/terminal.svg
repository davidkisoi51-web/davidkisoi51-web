<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="Terminal profile for David, full-stack developer">
<defs>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36D27E"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .line{opacity:0;animation:type 12s steps(1) infinite}
    @keyframes type{0%,4%{opacity:0}5%,90%{opacity:1}95%,100%{opacity:0}}
    .l1{animation-delay:.2s}.l2{animation-delay:.8s}.l3{animation-delay:1.7s}.l4{animation-delay:2.3s}
    .l5{animation-delay:4s}.l6{animation-delay:4.7s}.l7{animation-delay:6s}.l8{animation-delay:6.7s}
  </style>
</defs>
<rect x="1" y="1" width="858" height="438" rx="16" fill="#07130D" stroke="url(#green)" stroke-width="2"/>
<path d="M2 17a15 15 0 0 1 15-15h826a15 15 0 0 1 15 15v36H2z" fill="#0D1F16"/>
<circle cx="30" cy="30" r="7" fill="#36D27E"/><circle cx="54" cy="30" r="7" fill="#FFFFFF"/><circle cx="78" cy="30" r="7" fill="#7CBF91"/>
<text x="430" y="35" class="mono" font-size="14" fill="#A9B8AD" text-anchor="middle">david@dev: ~</text>
<g class="mono" font-size="18">
  <g class="line l1"><text x="40" y="100"><tspan fill="#36D27E">$ </tspan><tspan fill="#F3F7F4">whoami</tspan></text></g>
  <g class="line l2"><text x="40" y="132"><tspan fill="#A9B8AD">david </tspan><tspan fill="#36D27E">-&gt; </tspan><tspan fill="#F3F7F4">full-stack developer</tspan></text></g>
  <g class="line l3"><text x="40" y="180"><tspan fill="#36D27E">$ </tspan><tspan fill="#F3F7F4">cat focus.txt</tspan></text></g>
  <g class="line l4"><text x="40" y="212" fill="#A9B8AD">backend logic / scalable apps / clean UI to database</text></g>
  <g class="line l5"><text x="40" y="260"><tspan fill="#36D27E">$ </tspan><tspan fill="#F3F7F4">ls ~/stack</tspan></text></g>
  <g class="line l6"><text x="40" y="292" fill="#A9B8AD">javascript  react  python  flask  django  postgres  git  linux</text></g>
  <g class="line l7"><text x="40" y="340"><tspan fill="#36D27E">$ </tspan><tspan fill="#F3F7F4">echo $MOTTO</tspan></text></g>
  <g class="line l8"><text x="40" y="372" fill="#FFFFFF">learn by shipping. always building.</text></g>
</g>
<text x="40" y="420" class="mono" font-size="18"><tspan fill="#36D27E">$ </tspan><tspan class="cursor" fill="#F3F7F4">_</tspan></text>
</svg>
